# Shared by the English and the Spanish site. Each language is a separate
# MkDocs build that inherits this file (see en/mkdocs.yml and es/mkdocs.yml).

# TODO: the final URL, once the GitHub repository exists.
# site_url: https://<user>.github.io/co2-monitor-docs/

repo_url: https://github.com/TODO/co2-monitor
repo_name: co2-monitor

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Relative links, so the language switch works under any base path
# (a GitHub project page lives under /<repo>/).
extra:
  alternate:
    - name: English
      link: ../en/
      lang: en
    - name: Español
      link: ../es/
      lang: es

# Broken links and anchors fail a --strict build.
validation:
  links:
    anchors: warn
